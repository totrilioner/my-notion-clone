name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Lint Code
      run: npm run lint

    - name: Build Next.js App
      run: npm run build
      env:
        # Dummy secret for build process, as NextAuth requires it during build sometimes
        NEXTAUTH_SECRET: github-actions-secret-key-123
